name: Deploy server

# Redeploys the game server to Fly.io when server or engine code changes.
# Skips quietly until the FLY_API_TOKEN repo secret exists.
on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/game-core/**'
      - 'fly.toml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the Fly token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.token.outputs.ready == 'true'
        run: flyctl deploy --remote-only --ha=false
