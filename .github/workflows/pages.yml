name: Publish site

# Builds the game and publishes it to GitHub Pages on every merge to main.
# Needs Settings > Pages > Source set to "GitHub Actions".
# Site layout (under /PG2/ on github.io, at the root on pigeonchess.app):
#   /                 -> index.html
#   /docs/            -> design docs
#   /play/            -> the game (fresh build)
#   /game/dist/       -> redirects to /play/, for links shared before the move
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pigeon-chess/web build
        env:
          # Online play connects to the Fly.io game server (fly.toml).
          VITE_SERVER_URL: https://pigeon-chess-server.fly.dev
      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/game/dist
          cp index.html _site/
          cp docs/*.md _site/docs/
          cp -r game/dist _site/play
          cat > _site/game/dist/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Pigeon Chess</title>
          <meta http-equiv="refresh" content="0; url=../../play/">
          <a href="../../play/">Pigeon Chess has moved. Play here.</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
